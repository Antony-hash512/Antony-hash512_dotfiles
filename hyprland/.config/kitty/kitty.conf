# Дефолтный файл конфига с описаниями в комметариях,
# который обновляется вместе с пакетом: /usr/share/doc/kitty/kitty.conf
# В нём можно почитать комменты от авторов и сравнить его данным конфигом Meld'ом.
# Из данного же файла всё обилие закомментированных настроек вычищено.

#: Fonts {{{
#font_family      JetBrains Mono
#font_family      otf-hermit
font_family        monospace
#font_family        Noto Mono
#font_family        Noto Color Emoji
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

#font_family      Operator Mono Book
bold_font        Operator Mono Medium
italic_font      Operator Mono Book Italic
bold_italic_font Operator Mono Medium Italic

font_size 16.0

#: }}}

#: Window layout {{{

remember_window_size  no # исправляет неправильные размеры тайлового окна в hyprland
# (пробролема которая тут исправлена появилась осенью 2026 после очередного обновления kitty)

window_padding_width 10

#: }}}

#: Color scheme {{{

foreground #c0caf5
background #1a1b26

background_opacity 0.75

#: background_blur 10
selection_foreground #ffffff
selection_background #14b8a6

# normal colors

# Black
color0 #0b0c15
# Red
color1 #d2556c
# Green
color2 #7cd47b
# Yellow
color3 #efb184
# Blue
color4 #6ca1f3
# Magenta
color5 #b78df0
# Cyan
color6 #69bcf4
# White
color7 #c0caf5

# bright colors

# Bright Black
color8  #39404a
# Bright Red
color9  #f7768e
# Bright Green
color10 #85e89d
# Bright Yellow
color11 #f4cf8d
# Bright Blue
color12 #8fb9ff
# Bright Magenta
color13 #d9a3ff
# Bright Cyan
color14 #8fd3ff
# Bright White
color15 #f0f3f6

#: }}}

